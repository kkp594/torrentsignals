<script>
// ── single <script> block — no cross-tag variable references ──
var ALL_GUIDE = [];

// helper: small HTML builders used inside block bodies
function steps(arr){
  return '<div class="steps">' + arr.map(function(s,i){
    return '<div class="step"><div class="sn">'+(i+1)+'</div><p>'+s+'</p></div>';
  }).join('') + '</div>';
}
function tbl(heads, rows){
  var h = heads.map(function(x){return '<th>'+x+'</th>';}).join('');
  var r = rows.map(function(row){
    return '<tr>'+row.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';
  }).join('');
  return '<table class="t"><thead><tr>'+h+'</tr></thead><tbody>'+r+'</tbody></table>';
}
function tip(hdr,body){ return '<div class="tip"><b>'+hdr+'</b>'+body+'</div>'; }
function warn(hdr,body){ return '<div class="warn"><b>'+hdr+'</b>'+body+'</div>'; }
function pillBlock(pills, contents){
  var ph = pills.map(function(p,i){
    return '<span class="pill'+(i===0?' on':'')+'" onclick="spill(this)">'+p+'</span>';
  }).join('');
  var ch = contents.map(function(c,i){
    return '<div class="pc'+(i===0?' on':'')+'">'+c+'</div>';
  }).join('');
  return '<div class="pills">'+ph+'</div>'+ch;
}

// ── NAV BUILDER ────────────────────────────────────────────────
var SECTIONS = ['Overview','Pages','Config','Reference'];

function buildNav(q){
  q = (q||'').toLowerCase().trim();
  var nav = document.getElementById('sbNav');
  nav.innerHTML = '';
  SECTIONS.forEach(function(sec){
    var items = ALL_GUIDE.filter(function(g){
      if(g.section !== sec) return false;
      if(!q) return true;
      return g.label.toLowerCase().indexOf(q) >= 0 ||
             (g.tags||[]).some(function(t){ return t.indexOf(q) >= 0; });
    });
    if(!items.length) return;
    var hdr = document.createElement('div');
    hdr.className = 'sb-sec-hdr';
    hdr.textContent = sec;
    nav.appendChild(hdr);
    items.forEach(function(g){
      var el = document.createElement('div');
      el.className = 'sb-item';
      el.id = 'ni-'+g.id;
      el.innerHTML = '<span class="ic">'+g.icon+'</span>'+g.label;
      el.onclick = function(){ showPage(g.id); };
      nav.appendChild(el);
    });
  });
}

function filterNav(q){ buildNav(q); }

// ── PAGE RENDERER ───────────────────────────────────────────────
var activeId = null;

function showPage(id){
  var g = null;
  for(var i=0;i<ALL_GUIDE.length;i++){ if(ALL_GUIDE[i].id===id){ g=ALL_GUIDE[i]; break; } }
  if(!g) return;
  activeId = id;

  document.querySelectorAll('.sb-item').forEach(function(el){ el.classList.remove('active'); });
  var ni = document.getElementById('ni-'+id);
  if(ni){ ni.classList.add('active'); ni.scrollIntoView({block:'nearest'}); }

  var tagMap = {tb:'tb',tg:'tg',to:'to',tp:'tp',ty:'ty'};
  var tagsHtml = (g.hero.tags||[]).map(function(t){
    return '<span class="htag '+(tagMap[t[1]]||'tb')+'">'+t[0]+'</span>';
  }).join('');

  var html = '<div class="hero"><div class="h-icon">'+g.hero.icon+'</div>'
    +'<div><h1>'+g.hero.title+'</h1><p>'+g.hero.desc+'</p>'
    +'<div class="htags">'+tagsHtml+'</div></div></div>';

  (g.blocks||[]).forEach(function(b,i){
    var bid = 'b-'+id+'-'+i;
    var bodyHtml = typeof b.body === 'function' ? b.body() : b.body;
    html += '<div class="sc">'
      +'<div class="sc-h open" onclick="toggleBlock(\''+bid+'\',this)">'
      +'<span class="sic">'+b.icon+'</span><h3>'+b.title+'</h3>'
      +'<span class="arr">&#9658;</span></div>'
      +'<div class="sc-b open" id="'+bid+'">'+bodyHtml+'</div>'
      +'</div>';
  });

  var cw = document.getElementById('cw');
  cw.innerHTML = html;
  cw.scrollTop = 0;
}

function toggleBlock(id, head){
  var body = document.getElementById(id);
  if(!body) return;
  var open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  head.classList.toggle('open', !open);
}

// ── PILL SWITCHER ───────────────────────────────────────────────
function spill(el){
  var parent = el.closest('.sc-b');
  if(!parent) return;
  var pills = parent.querySelectorAll('.pill');
  var pcs   = parent.querySelectorAll('.pc');
  var idx = Array.prototype.indexOf.call(pills, el);
  pills.forEach(function(p){ p.classList.remove('on'); });
  pcs.forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
  if(pcs[idx]) pcs[idx].classList.add('on');
}

// ── INIT ────────────────────────────────────────────────────────
(function(){
  var css = localStorage.getItem('theme_css');
  if(css){ var s=document.createElement('style'); s.textContent=css; document.head.appendChild(s); }
  buildNav();
  showPage('getting-started');
})();
</script>
